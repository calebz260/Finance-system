name: CI

# Every push and pull request runs the full gate. Merging is blocked on a failing gate
# rather than depending on someone remembering to run the suite locally (Section 3).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Credentials for the throwaway service container only. Never reuse in any environment.
  POSTGRES_USER: sfs
  POSTGRES_PASSWORD: sfs_ci_password
  POSTGRES_DB: school_finance_ci

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sfs
          POSTGRES_PASSWORD: sfs_ci_password
          POSTGRES_DB: school_finance_ci
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfs -d school_finance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://sfs:sfs_ci_password@localhost:5432/school_finance_ci?schema=public
      TEST_DATABASE_URL: postgresql://sfs:sfs_ci_password@localhost:5432/school_finance_ci?schema=public
      CI: 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        # The backend and frontend both consume @sfs/shared from its compiled output.
        run: npm run build --workspace @sfs/shared

      - name: Generate Prisma client
        run: npm run db:generate --workspace @sfs/backend

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        # No migrations exist until Phase 1; `migrate deploy` is a no-op that still
        # verifies the CLI can reach the database.
        run: npm run db:migrate:deploy --workspace @sfs/backend

      - name: Test -- shared
        run: npm run test --workspace @sfs/shared

      - name: Test -- backend (unit and integration, against real PostgreSQL)
        run: npm run test --workspace @sfs/backend

      - name: Test -- frontend
        run: npm run test --workspace @sfs/frontend

      - name: Build
        run: npm run build
